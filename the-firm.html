  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

eparation the other side expects only from a firm ten times our size.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:36px 56px;padding-top:20px;border-top:1px solid rgba(255,255,255,0.2);margin-top:10px\">\n        <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'Instrument Serif',serif;font-size:clamp(36px,3.4vw,52px);line-height:1\">2019<\u002Fspan><span style=\"font-size:11px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.65)\">Founded in Forest Hills<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'Instrument Serif',serif;font-size:clamp(36px,3.4vw,52px);line-height:1\">NY · NJ<\u002Fspan><span style=\"font-size:11px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.65)\">Licensed in two states<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'Instrument Serif',serif;font-size:clamp(36px,3.4vw,52px);line-height:1\">$4M+<\u002Fspan><span style=\"font-size:11px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.65)\">Recovered for clients<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'Instrument Serif',serif;font-size:clamp(36px,3.4vw,52px);line-height:1\">24/7<\u002Fspan><span style=\"font-size:11px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.65)\">Attorney access<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:#fff;padding:clamp(72px,8vw,128px) 28px\">\n    <div style=\"max-width:1320px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:clamp(40px,6vw,96px);align-items:center\">\n      <div style=\"display:flex;flex-direction:column;gap:24px;min-width:0\">\n        <span style=\"font-size:12px;font-weight:600;letter-spacing:0.26em;text-transform:uppercase;color:var(--acc)\">Our story<\u002Fspan>\n        <h2 style=\"margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(40px,4.8vw,68px);line-height:1;letter-spacing:-0.02em\">Queens-raised. Courtroom-made.<\u002Fh2>\n        <p style=\"margin:0;font-size:17px;line-height:1.75;color:#4B5160;max-width:52ch\">Hawlader Law began with a simple frustration: too many injured New Yorkers were treated like file numbers — passed to paralegals, settled early, and told it was the best they could do.<\u002Fp>\n        <p style=\"margin:0;font-size:17px;line-height:1.75;color:#4B5160;max-width:52ch\">We built the firm the other way around. One attorney owns your case from the first call to the final check. Every file is prepared as if it will be tried, because the insurer’s offer depends on whether they believe it will be.<\u002Fp>\n        <p style=\"margin:0;font-family:'Instrument Serif',serif;font-size:clamp(24px,2.2vw,32px);line-height:1.25;letter-spacing:-0.01em;color:#0B0D12;border-left:3px solid var(--acc);padding-left:24px;max-width:36ch\">“The other side has lawyers on retainer. The only way to even that out is to out-prepare them.”<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"position:relative;min-width:0\">\n        <img src=\"2db8663a-d202-4a7b-adf9-9360e2d7e7e6\" alt=\"Jay Hawlader outside the courthouse\" style=\"display:block;width:100%;height:clamp(440px,48vw,640px);object-fit:cover;object-position:50% 20%\">\n        <div style=\"position:absolute;left:-1px;bottom:-1px;background:#0B1640;color:#fff;padding:20px 26px;display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:11px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:#9DB2F2\">Founding attorney<\u002Fspan><span style=\"font-family:'Instrument Serif',serif;font-size:26px;line-height:1\">Jay Hawlader, Esq.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:#0B1640;color:#fff;padding:clamp(72px,8vw,128px) 28px;position:relative;overflow:hidden\">\n    <div style=\"position:absolute;left:-2vw;bottom:-0.25em;font-family:'Instrument Serif',serif;font-size:clamp(200px,28vw,460px);line-height:1;color:rgba(255,255,255,0.03);pointer-events:none;letter-spacing:-0.05em\">Values<\u002Fdiv>\n    <div style=\"position:relative;max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(40px,5vw,64px)\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:24px 64px;align-items:end\">\n        <div style=\"display:flex;flex-direction:column;gap:14px\"><span style=\"font-size:12px;font-weight:600;letter-spacing:0.26em;text-transform:uppercase;color:#9DB2F2\">How we work<\u002Fspan><h2 style=\"margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(40px,4.8vw,68px);line-height:1;letter-spacing:-0.02em\">Four commitments. No exceptions.<\u002Fh2><\u002Fdiv>\n        <p style=\"margin:0;font-size:17px;line-height:1.7;color:rgba(255,255,255,0.74);max-width:46ch;justify-self:end\">These are not slogans. They are the operating rules of the firm, and the reasons clients send us their families.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:1px;background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.16)\">\n        <div style=\"background:#0B1640;padding:36px 30px;display:flex;flex-direction:column;gap:18px;min-height:300px\" style-hover=\"background:#0F1A45\"><span style=\"font-family:'Instrument Serif',serif;font-size:44px;line-height:1;color:#9DB2F2\">01<\u002Fspan><strong style=\"font-size:21px;letter-spacing:-0.01em;line-height:1.2\">You talk to your attorney<\u002Fstrong><p style=\"margin:0;font-size:15px;line-height:1.65;color:rgba(255,255,255,0.72)\">Not a case manager. Not a call center. The attorney handling your case has your number — and you have theirs.<\u002Fp><\u002Fdiv>\n        <div style=\"background:#0B1640;padding:36px 30px;display:flex;flex-direction:column;gap:18px;min-height:300px\" style-hover=\"background:#0F1A45\"><span style=\"font-family:'Instrument Serif',serif;font-size:44px;line-height:1;color:#9DB2F2\">02<\u002Fspan><strong style=\"font-size:21px;letter-spacing:-0.01em;line-height:1.2\">Every case is trial-ready<\u002Fstrong><p style=\"margin:0;font-size:15px;line-height:1.65;color:rgba(255,255,255,0.72)\">We prepare as if a jury will see it. Most cases settle — on our terms — precisely because the other side knows we will try it.<\u002Fp><\u002Fdiv>\n        <div style=\"background:#0B1640;padding:36px 30px;display:flex;flex-direction:column;gap:18px;min-height:300px\" style-hover=\"background:#0F1A45\"><span style=\"font-family:'Instrument Serif',serif;font-size:44px;line-height:1;color:#9DB2F2\">03<\u002Fspan><strong style=\"font-size:21px;letter-spacing:-0.01em;line-height:1.2\">Honest answers, early<\u002Fstrong><p style=\"margin:0;font-size:15px;line-height:1.65;color:rgba(255,255,255,0.72)\">If a case isn’t worth pursuing, we say so at the first call. If it is, we tell you what it could be worth and what it will take.<\u002Fp><\u002Fdiv>\n        <div style=\"background:#0B1640;padding:36px 30px;display:flex;flex-direction:column;gap:18px;min-height:300px\" style-hover=\"background:#0F1A45\"><span style=\"font-family:'Instrument Serif',serif;font-size:44px;line-height:1;color:#9DB2F2\">04<\u002Fspan><strong style=\"font-size:21px;letter-spacing:-0.01em;line-height:1.2\">You pay nothing unless we win<\u002Fstrong><p style=\"margin:0;font-size:15px;line-height:1.65;color:rgba(255,255,255,0.72)\">No retainer, no hourly bills, no case costs out of pocket. Our fee comes from the recovery — and only if there is one.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:#F6F7F9;padding:clamp(72px,8vw,128px) 28px\">\n    <div style=\"max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(36px,4vw,56px)\">\n      <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px 32px\">\n        <div style=\"display:flex;flex-direction:column;gap:14px\"><span style=\"font-size:12px;font-weight:600;letter-spacing:0.26em;text-transform:uppercase;color:var(--acc)\">What we handle<\u002Fspan><h2 style=\"margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(40px,4.8vw,68px);line-height:1;letter-spacing:-0.02em\">Multi-practice law firm. One standard.<\u002Fh2><\u002Fdiv>\n        <a href=\"/#practice\" style=\"font-size:13px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#0B0D12;border-bottom:1px solid #0B0D12;padding-bottom:4px\" style-hover=\"color:var(--acc);border-color:var(--acc)\">All practice areas →<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px\">\n        <a href=\"/#practice\" style=\"background:#fff;padding:36px 32px;display:flex;flex-direction:column;gap:18px;min-height:320px;border-bottom:3px solid transparent;color:#0B0D12\" style-hover=\"border-bottom-color:var(--acc);color:#0B0D12\"><span style=\"font-size:12px;font-weight:600;letter-spacing:0.26em;text-transform:uppercase;color:var(--acc)\">01<\u002Fspan><h3 style=\"margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(32px,3vw,44px);line-height:1;letter-spacing:-0.02em\">Personal Injury<\u002Fh3><p style=\"margin:0;font-size:15px;line-height:1.65;color:#4B5160\">Car, truck, bicycle and pedestrian collisions. Falls, construction accidents, dog bites and wrongful death.<\u002Fp><span style=\"margin-top:auto;font-size:13px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--acc)\">Learn more →<\u002Fspan><\u002Fa>\n        <a href=\"/#practice\" style=\"background:#fff;padding:36px 32px;display:flex;flex-direction:column;gap:18px;min-height:320px;border-bottom:3px solid transparent;color:#0B0D12\" style-hover=\"border-bottom-color:var(--acc);color:#0B0D12\"><span style=\"font-size:12px;font-weight:600;letter-spacing:0.26em;text-transform:uppercase;color:var(--acc)\">02<\u002Fspan><h3 style=\"margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(32px,3vw,44px);line-height:1;letter-spacing:-0.02em\">Employment<\u002Fh3><p style=\"margin:0;font-size:15px;line-height:1.65;color:#4B5160\">Discrimination, harassment, retaliation, and wage and hour violations against New York and New Jersey employers.<\u002Fp><span style=\"margin-top:auto;font-size:13px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--acc)\">Learn more →<\u002Fspan><\u002Fa>\n        <a href=\"/#practice\" style=\"background:#fff;padding:36px 32px;display:flex;flex-direction:column;gap:18px;min-height:320px;border-bottom:3px solid transparent;color:#0B0D12\" style-hover=\"border-bottom-color:var(--acc);color:#0B0D12\"><span style=\"font-size:12px;font-weight:600;letter-spacing:0.26em;text-transform:uppercase;color:var(--acc)\">03<\u002Fspan><h3 style=\"margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(32px,3vw,44px);line-height:1;letter-spacing:-0.02em\">Other Practice Areas<\u002Fh3><p style=\"margin:0;font-size:15px;line-height:1.65;color:#4B5160\">Immigration law, criminal defense and commercial litigation — handled with the same preparation.<\u002Fp><span style=\"margin-top:auto;font-size:13px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--acc)\">Learn more →<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:#fff;padding:clamp(72px,8vw,128px) 28px\">\n    <div style=\"max-width:1320px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:clamp(40px,6vw,96px);align-items:center\">\n      <div style=\"display:flex;flex-direction:column;gap:22px;min-width:0\">\n        <span style=\"font-size:12px;font-weight:600;letter-spacing:0.26em;text-transform:uppercase;color:var(--acc)\">Where we practice<\u002Fspan>\n        <h2 style=\"margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(40px,4.8vw,68px);line-height:1;letter-spacing:-0.02em\">New York and New Jersey. We come to you.<\u002Fh2>\n        <p style=\"margin:0;font-size:17px;line-height:1.7;color:#4B5160;max-width:48ch\">Headquartered in Forest Hills, minutes from the Queens County courthouse. We appear in all five boroughs, Nassau and Suffolk, upstate New York, and across New Jersey — and we meet clients at home or in the hospital when that is what the case needs.<\u002Fp>\n        <a href=\"#contact\" style=\"display:inline-flex;align-items:center;gap:12px;background:var(--acc);color:#fff;padding:18px 30px;font-size:13px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;align-self:flex-start\" style-hover=\"background:#0B1640;color:#fff\">Schedule a free consultation <span aria-hidden=\"true\">→<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;background:#E7E9EE;border:1px solid #E7E9EE;min-width:0\">\n        <div style=\"background:#F6F7F9;padding:28px 26px;display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'Instrument Serif',serif;font-size:30px;line-height:1\">Queens<\u002Fspan><span style=\"font-size:13px;color:#6B7280\">Home office · Forest Hills<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#F6F7F9;padding:28px 26px;display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'Instrument Serif',serif;font-size:30px;line-height:1\">Brooklyn<\u002Fspan><span style=\"font-size:13px;color:#6B7280\">Kings County Supreme<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#F
