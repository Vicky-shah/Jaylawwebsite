  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }

    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin
      : '*';
    function trustedOrigin(e) {

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ont-weight:700;letter-spacing:-0.035em\">Queens car accident <span style=\"font-family:'Instrument Serif',serif;font-weight:400;font-style:italic;letter-spacing:-0.01em;color:#9DB2F2\">lawyers.<\u002Fspan><\u002Fh1>\n        <p style=\"margin:0;font-size:clamp(17px,1.3vw,20px);line-height:1.65;color:rgba(255,255,255,0.74);max-width:52ch\">Hurt in a crash in New York or New Jersey? We take over the insurance fight, build the medical record, and pursue every dollar you're owed — at no cost unless we win.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:14px\">\n          <a href=\"#contact\" style=\"background:var(--acc);color:#fff;padding:18px 30px;font-size:14px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase\" style-hover=\"background:#fff;color:#0B1640\">Free case review<\u002Fa>\n          <a href=\"tel:2124648403\" style=\"border:1px solid rgba(255,255,255,0.35);color:#fff;padding:17px 26px;font-size:14px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase\" style-hover=\"border-color:#fff\">Call (212) 464-8403<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:rgba(255,255,255,0.18);min-width:0;border:1px solid rgba(255,255,255,0.18)\">\n        <div style=\"background:rgba(11,22,64,0.82);backdrop-filter:blur(6px);padding:26px 22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'Instrument Serif',serif;font-size:clamp(34px,3.4vw,52px);line-height:0.9;color:#9DB2F2\">$0<\u002Fspan><span style=\"font-size:11px;font-weight:600;letter-spacing:0.18px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.6)\">Upfront fees<\u002Fspan><\u002Fdiv>\n        <div style=\"background:rgba(11,22,64,0.82);backdrop-filter:blur(6px);padding:26px 22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'Instrument Serif',serif;font-size:clamp(34px,3.4vw,52px);line-height:0.9;color:#9DB2F2\">30<\u002Fspan><span style=\"font-size:11px;font-weight:600;letter-spacing:0.18px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.6)\">Days to file no-fault<\u002Fspan><\u002Fdiv>\n        <div style=\"background:rgba(11,22,64,0.82);backdrop-filter:blur(6px);padding:26px 22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'Instrument Serif',serif;font-size:clamp(34px,3.4vw,52px);line-height:0.9;color:#9DB2F2\">24/7<\u002Fspan><span style=\"font-size:11px;font-weight:600;letter-spacing:0.18px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.6)\">Attorney access<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:#fff;padding:clamp(56px,6vw,96px) 28px\">\n    <div style=\"max-width:1320px;margin:0 auto;display:flex;flex-wrap:wrap;gap:clamp(40px,6vw,96px);align-items:flex-start\">\n\n      <article style=\"flex:1 1 520px;display:flex;flex-direction:column;gap:30px;min-width:0\">\n      <div id=\"overview\" data-spy=\"1\" style=\"scroll-margin-top:130px;display:flex;flex-direction:column;gap:14px;padding-top:8px\">\n        <span style=\"font-size:12px;font-weight:600;letter-spacing:0.26em;text-transform:uppercase;color:var(--acc)\">01 — Overview<\u002Fspan>\n        <h2 style=\"margin:0;font-size:clamp(30px,3.2vw,44px);line-height:1.05;font-weight:700;letter-spacing:-0.03em;color:#0B0D12\">Why car accident claims in New York are harder than they look<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:17px;line-height:1.75;color:#3A3F4B\">New York is a no-fault state. After a crash, your own insurer pays your initial medical bills and lost wages through Personal Injury Protection — regardless of who caused it. But no-fault benefits are capped at $50,000 and pay nothing for pain and suffering. To recover more, you must prove a <strong>“serious injury”<\u002Fstrong> under Insurance Law §5102(d) and bring a claim against the at-fault driver.<\u002Fp>\n      <p style=\"margin:0;font-size:17px;line-height:1.75;color:#3A3F4B\">That threshold is where most claims are lost. Adjusters are trained to characterize fractures as sprains, herniated discs as “pre-existing,” and gaps in treatment as proof you weren't really hurt. We close those gaps before they open — coordinating care, preserving the evidence, and documenting every limitation the injury puts on your life.<\u002Fp>\n        <figure style=\"margin:0;background:#F6F7F9;border-left:3px solid var(--acc);padding:28px 32px;display:flex;flex-direction:column;gap:12px\">\n          <blockquote style=\"margin:0;font-family:'Instrument Serif',serif;font-size:clamp(22px,2.2vw,30px);line-height:1.3;color:#0B0D12\">“The first offer is a test of whether you have a lawyer. The second is a test of whether that lawyer will try the case.”<\u002Fblockquote>\n          <figcaption style=\"font-size:12px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#6B7280\">Jay Hawlader, Esq.<\u002Ffigcaption>\n        <\u002Ffigure>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:2px;background:#E7E9EE;border:1px solid #E7E9EE\">\n          <div style=\"background:#fff;padding:22px;display:flex;flex-direction:column;gap:8px\"><strong style=\"font-size:15px\">Rear-end &amp; intersection collisions<\u002Fstrong><span style=\"font-size:14px;line-height:1.6;color:#5B6373\">Queens Blvd, the LIE, Grand Central and the Van Wyck.<\u002Fspan><\u002Fdiv>\n          <div style=\"background:#fff;padding:22px;display:flex;flex-direction:column;gap:8px\"><strong style=\"font-size:15px\">Rideshare &amp; taxi crashes<\u002Fstrong><span style=\"font-size:14px;line-height:1.6;color:#5B6373\">Uber, Lyft and TLC policies with up to $1.25M in coverage.<\u002Fspan><\u002Fdiv>\n          <div style=\"background:#fff;padding:22px;display:flex;flex-direction:column;gap:8px\"><strong style=\"font-size:15px\">Hit-and-run &amp; uninsured drivers<\u002Fstrong><span style=\"font-size:14px;line-height:1.6;color:#5B6373\">Recovery through your own UM/SUM coverage or MVAIC.<\u002Fspan><\u002Fdiv>\n          <div style=\"background:#fff;padding:22px;display:flex;flex-direction:column;gap:8px\"><strong style=\"font-size:15px\">Drunk &amp; distracted driving<\u002Fstrong><span style=\"font-size:14px;line-height:1.6;color:#5B6373\">Punitive damages where the conduct was reckless.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n      <div id=\"steps\" data-spy=\"1\" style=\"scroll-margin-top:130px;display:flex;flex-direction:column;gap:14px;padding-top:8px\">\n        <span style=\"font-size:12px;font-weight:600;letter-spacing:0.26em;text-transform:uppercase;color:var(--acc)\">02 — After the crash<\u002Fspan>\n        <h2 style=\"margin:0;font-size:clamp(30px,3.2vw,44px);line-height:1.05;font-weight:700;letter-spacing:-0.03em;color:#0B0D12\">Six things to do in the first 72 hours<\u002Fh2>\n      <\u002Fdiv>\n        <ol style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;border-top:1px solid #E7E9EE\">\n          <li style=\"display:grid;grid-template-columns:64px minmax(0,1fr);gap:20px;padding:22px 0;border-bottom:1px solid #E7E9EE\"><span style=\"font-family:'Instrument Serif',serif;font-size:34px;line-height:1;color:var(--acc)\">01<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:6px\"><strong style=\"font-size:17px\">Call 911 and get a police report<\u002Fstrong><span style=\"font-size:15px;line-height:1.65;color:#5B6373\">The MV-104A report fixes the date, location, parties and the officer’s first impression of fault.<\u002Fspan><\u002Fdiv><\u002Fli>\n          <li style=\"display:grid;grid-template-columns:64px minmax(0,1fr);gap:20px;padding:22px 0;border-bottom:1px solid #E7E9EE\"><span style=\"font-family:'Instrument Serif',serif;font-size:34px;line-height:1;color:var(--acc)\">02<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:6px\"><strong style=\"font-size:17px\">Photograph everything<\u002Fstrong><span style=\"font-size:15px;line-height:1.65;color:#5B6373\">Vehicle positions, damage, skid marks, signals, weather, and your visible injuries.<\u002Fspan><\u002Fdiv><\u002Fli>\n          <li style=\"display:grid;grid-template-columns:64px minmax(0,1fr);gap:20px;padding:22px 0;border-bottom:1px solid #E7E9EE\"><span style=\"font-family:'Instrument Serif',serif;font-size:34px;line-height:1;color:var(--acc)\">03<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:6px\"><strong style=\"font-size:17px\">See a doctor the same day<\u002Fstrong><span style=\"font-size:15px;line-height:1.65;color:#5B6373\">Adrenaline masks injury. Any delay becomes the insurer’s argument that you weren’t hurt.<\u002Fspan><\u002Fdiv><\u002Fli>\n          <li style=\"display:grid;grid-template-columns:64px minmax(0,1fr);gap:20px;padding:22px 0;border-bottom:1px solid #E7E9EE\"><span style=\"font-family:'Instrument Serif',serif;font-size:34px;line-height:1;color:var(--acc)\">04<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:6px\"><strong style=\"font-size:17px\">File your no-fault application within 30 days<\u002Fstrong><span style=\"font-size:15px;line-height:1.65;color:#5B6373\">Miss the NF-2 deadline and you can lose medical and wage benefits entirely. We file it for you.<\u002Fspan><\u002Fdiv><\u002Fli>\n          <li style=\"display:grid;grid-template-columns:64px minmax(0,1fr);gap:20px;padding:22px 0;border-bottom:1px solid #E7E9EE\"><span style=\"font-family:'Instrument Serif',serif;font-size:34px;line-height:1;color:var(--acc)\">05<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:6px\"><strong style=\"font-size:17px\">Don’t give a recorded statement<\u002Fstrong><span style=\"font-size:15px;line-height:1.65;color:#5B6373\">The other driver’s adjuster is not neutral. Politely decline and refer them to us.<\u002Fspan><\u002Fdiv><\u002Fli>\n          <li style=\"display:grid;grid-template-columns:64px minmax(0,1fr);gap:20px;padding:22px 0;border-bottom:1px solid #E7E9EE\"><span style=\"font-family:'Instrument Serif',serif;font-size:34px;line-height:1;color:var(--acc)\">06<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:6px\"><strong style=\"font-size:17px\">Preserve the evidence<\u002Fstrong><span style=\"font-size:15px;line-height:1.65;color:#5B6373\">Dashcam footage, nearby business cameras and vehicle event-data are overwritten in days. We send preservation letters immediately.<\u002Fspan><\u002Fdiv><\u002Fli>\n        <\u002Fol>\n\n      <div id=\"compensation\" data-spy=\"1\" style=\"scroll-margin-top:130px;display:flex;flex-direction:column;gap:14px;padding-top:8px\">\n        <span style=\"font-size:12px;font-weight:600;letter-spacing:0.26em;text-transform:uppercase;color:var(--acc)\">03 — Compensation<\u002Fspan>\n        <h2 style=\"margin:0;font-size:clamp(30px,3.2vw,44px);line-height:1.05;font-weight:700;letter-spacing:-0.03em;color:#0B0D12\">What you can recover<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:17px;line-height:1.75;color:#3A3F4B\">A car accident claim has two halves. <strong>Economic damages<\u002Fstrong> are the bills: emergency care, surgery, physical therapy, future treatment, lost wages and diminished earning capacity. <strong>Non-economic damages<\u002Fstrong> compensate for pain, disfigurement, and the loss of the life you had before the crash — and they are usually the larger number.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:20px\">\n          <div style=\"background:#0B1640;color:#fff;padding:30px;display:flex;flex-direction:column;gap:16px\"><span style=\"font-size:11px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:#9DB2F2\">Economic<\u002Fspan><ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.5;color:rgba(255,255,255,0.84)\"><li>Medical bills, past and future<\u002Fli><li>Lost wages and overtime<\u002Fli><li>Reduced earning capacity<\u002Fli><li>Rehabilitation and home care<\u002Fli><li>Property damage<\u002Fli><\u002Ful><\u002Fdiv>\n          <div style=\"background:#F6F7F9;padding:30px;display:flex;flex-direction:column;gap:16px;border:1px solid #E7E9EE\"><span style=\"font-size:11px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:var(--acc)\">Non-economic<\u002Fspan><ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.5;color:#3A3F4B\"><li>Pain and suffering<\u002Fli><li>Scarring and disfigurement<\u002Fli><li>Loss of enjoyment of life<\u002Fli><li>Emotional distress<\u002Fli><li>Loss of consortium<\u002Fli><\u002Ful><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:#E7E9EE;border:1px solid #E7E9EE\">\n          <div style=\"background:#fff;padding:24px;display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'Instrument Serif',serif;font-size:40px;line-height:0.9;color:var(--acc)\">$250,000<\u002Fspan><span style=\"font-size:12px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#6B7280\">Illegal left turn · torn rotator cuff<\u002Fspan><\u002Fdiv>\n          <div style=\"background:#fff;padding:24px;display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'Instrument Serif',serif;font-size:40px;line-height:0.9;color:var(--acc)\">$300,000<\u002Fspan><span style=\"font-size:12px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#6B7280\">Cyclist struck · fractured collarbone<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:12px;color:#9CA3AF\">Prior results do not guarantee a similar outcome.<\u002Fp>\n\n      <div id=\"fault\" data-spy=\"1\" style=\"scroll-margin-top:130px;display:flex;flex-direction:column;gap:14px;padding-top:8px\">\n        <span style=\"font-size:12px;font-weight:600;letter-spacing:0.26em;text-transform:uppercase;color:var(--acc)\">04 — Fault &amp; no-fault<\u002Fspan>\n        <h2 style=\"margin:0;font-size:clamp(30px,3.2vw,44px);line-height:1.05;font-weight:700;letter-spacing:-0.03em;color:#0B0D12\">Who pays — and what if you were partly at fault?<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:17px;line-height:1.75;color:#3A3F4B\">New York follows <strong>pure comparative negligence<\u002Fstrong>. If you were 20% responsible, you still recover 80% of your damages. Insurers exploit this by inflating your share of blame — “you were speeding,” “you braked suddenly.” We counter with the physical evidence: crush analysis, event-data recorders, signal timing and independent witnesses.<\u002Fp>\n      <p style=\"margin:0;font-size:17px;line-height:1.75;color:#3A3F4B\">New Jersey crashes work differently. Many NJ policies carry a <strong>“limitation on lawsuit”<\u002Fstrong> option that restricts pain-and-suffering claims unless the injury is permanent. We review your declarations page in the first conversation so you know exactly which door is open.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:20px\">\n          <div style=\"border-top:3px solid var(--acc);padding-top:16px;display:flex;flex-direction:column;gap:6px\"><strong style=\"font-size:15px\">Serious injury threshold<\u002Fstrong><span style=\"font-size:14px;line-height:1.6;color:#5B6373\">Fracture, significant disfigurement, permanent limitation, or 90/180-day disability.<\u002Fspan><\u002Fdiv>\n          <div style=\"border-top:3px solid var(--acc);padding-top:16px;display:flex;flex-direction:column;gap:6px\"><strong style=\"font-size:15px\">Statute of limitations<\u002Fstrong><span style=\"font-size:14px;line-height:1.6;color:#5B6373\">Three years in NY, two in NJ — and only 90 days to file a notice of claim against a city vehicle or bus.<\u002Fspan><\u002Fdiv>\n          <div style=\"border-top:3px solid var(--acc);padding-top:16px;display:flex;flex-direction:column;gap:6px\"><strong style=\"font-size:15px\">Multiple defendants<\u002Fstrong><span style=\"font-size:14px;line-height:1.6;color:#5B6373\">Employers, vehicle owners, rideshare platforms and the City can all share liability.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n      <div id=\"process\" data-spy=\"1\" style=\"scroll-margin-top:130px;display:flex;flex-direction:column;gap:14px;padding-top:8px\">\n        <span style=\"font-size:12px;font-weight:600;letter-spacing:0.26em;text-transform:uppercase;color:var(--acc)\">05 — How we work<\u002Fspan>\n        <h2 style=\"margin:0;font-size:clamp(30px,3.2vw,44px);line-height:1.05;font-weight:700;letter-spacing:-0.03em;color:#0B0D12\">From first call to recovery<\u002Fh2>\n      <\u002Fdiv>\n        <ol style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column\">\n          <li style=\"display:grid;grid-template-columns:48px minmax(0,1fr);gap:24px;position:relative;padding-bottom:36px\">\n            <span style=\"position:absolute;left:23px;top:48px;bottom:0;width:2px;background:#E7E9EE\"><\u002Fspan>\n            <span style=\"width:48px;height:48px;border-radius:50%;background:var(--acc);color:#fff;border:2px solid var(--acc);display:flex;align-items:center;justify-content:center;font-family:'Instrument Serif',serif;font-size:20px;position:relative;z-index:1\">01<\u002Fspan>\n            <div style=\"display:flex;flex-direction:column;gap:8px;padding-top:4px;min-width:0\">\n              <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px\"><strong style=\"font-size:20px;letter-spacing:-0.01em\">Investigate &amp; protect<\u002Fstrong><span style=\"font-size:11px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:var(--acc)\">Week 1<\u002Fspan><\u002Fdiv>\n              <span style=\"font-size:15px;line-height:1.65;color:#5B6373;max-width:60ch\">No-fault filed, evidence preserved, insurers notified that all contact goes through us.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fli>\n          <li style=\"display:grid;grid-template-columns:48px minmax(0,1fr);gap:24px;position:relative;padding-bottom:36px\">\n            <span style=\"position:absolute;left:23px;top:48px;bottom:0;width:2px;background:#E7E9EE\"><\u002Fspan>\n            <span style=\"width:48px;height:48px;border-radius:50%;background:#fff;color:var(--acc);border:2px solid var(--acc);display:flex;align-items:center;justify-content:center;font-family:'Instrument Serif',serif;font-size:20px;position:relative;z-index:1\">02<\u002Fspan>\n            <div style=\"display:flex;flex-direction:column;gap:8px;padding-top:4px;min-width:0\">\n              <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px\"><strong style=\"font-size:20px;letter-spacing:-0.01em\">Treat &amp; document<\u002Fstrong><span style=\"font-size:11px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:var(--acc)\">Months 1–6<\u002Fspan><\u002Fdiv>\n              <span style=\"font-size:15px;line-height:1.65;color:#5B6373;max-width:60ch\">You focus on recovery. We build the medical narrative and track every expense.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fli>\n          <li style=\"display:grid;grid-template-columns:48px minmax(0,1fr);gap:24px;position:relative;padding-bottom:36px\">\n            <span style=\"position:absolute;left:23px;top:48px;bottom:0;width:2px;background:#E7E9EE\"><\u002Fspan>\n            <span style=\"width:48px;height:48px;border-radius:50%;background:#fff;color:var(--acc);border:2px solid var(--acc);display:flex;align-items:center;justify-content:center;font-family:'Instrument Serif',serif;font-size:20px;position:relative;z-index:1\">03<\u002Fspan>\n            <div style=\"display:flex;flex-direction:column;gap:8px;padding-top:4px;min-width:0\">\n              <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px\"><strong style=\"font-size:20px;letter-spacing:-0.01em\">Negotiate from strength<\u002Fstrong><span style=\"font-size:11px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:var(--acc)\">Demand<\u002Fspan><\u002Fdiv>\n              <span style=\"font-size:15px;line-height:1.65;color:#5B6373;max-width:60ch\">A trial-ready demand package. Insurers pay more when they know we will file.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fli>\n          <li style=\"display:grid;grid-template-columns:48px minmax(0,1fr);gap:24px;position:relative;padding-bottom:0\">\n            \n            <span style=\"width:48px;height:48px;border-radius:50%;background:#fff;color:var(--acc);border:2px solid var(--acc);display:flex;align-items:center;justify-content:center;font-family:'Instrument Serif',serif;font-size:20px;position:relative;z-index:1\">04<\u002Fspan>\n            <div style=\"display:flex;flex-direction:column;gap:8px;padding-top:4px;min-width:0\">\n              <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px\"><strong style=\"font-size:20px;letter-spacing:-0.01em\">Litigate &amp; try<\u002Fstrong><span style=\"font-size:11px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:var(--acc)\">If needed<\u002Fspan><\u002Fdiv>\n              <span style=\"font-size:15px;line-height:1.65;color:#5B6373;max-width:60ch\">Suit filed in Queens, Kings, New York or Bronx County. Most cases settle; we prepare as if none will.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fli>\n        <\u002Fol>\n\n      <div id=\"faq\" data-spy=\"1\" style=\"scroll-margin-top:130px;display:flex;flex-direction:column;gap:14px;padding-top:8px\">\n        <span style=\"font-size:12px;font-weight:600;letter-spacing:0.26em;text-transform:uppercase;color:var(--acc)\">06 — FAQ<\u002Fspan>\n        <h2 style=\"margin:0;font-size:clamp(30px,3.2vw,44px);line-height:1.05;font-weight:700;letter-spacing:-0.03em;color:#0B0D12\">Common questions<\u002Fh2>\n      <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;border-top:1px solid #E7E9EE\">\n          <details style=\"border-bottom:1px solid #E7E9EE\"><summary style=\"cursor:pointer;list-style:none;padding:20px 0;font-size:17px;font-weight:600;display:flex;justify-content:space-between;gap:16px\">How much does a car accident lawyer cost?<span style=\"color:var(--acc)\">+<\u002Fspan><\u002Fsummary><p style=\"margin:0 0 20px;font-size:15px;line-height:1.7;color:#3A3F4B;max-width:70ch\">Nothing upfront. We work on contingency — our fee is a percentage of what we recover, and we advance all case costs. If there is no recovery, you owe us nothing.<\u002Fp><\u002Fdetails>\n          <details style=\"border-bottom:1px solid #E7E9EE\"><summary style=\"cursor:pointer;list-style:none;padding:20px 0;font-size:17px;font-weight:600;display:flex;justify-content:space-between;gap:16px\">The insurance company already made an offer. Should I take it?<span style=\"color:var(--acc)\">+<\u002Fspan><\u002Fsummary><p style=\"margin:0 0 20px;font-size:15px;line-height:1.7;color:#3A3F4B;max-width:70ch\">Not before a lawyer reviews it. Early offers are made before the full extent of your injuries is known and typically represent a fraction of the claim’s value. Accepting closes the claim permanently.<\u002Fp><\u002Fdetails>\n          <details style=\"border-bottom:1px solid #E7E9EE\"><summary style=\"cursor:pointer;list-style:none;padding:20px 0;font-size:17px;font-weight:600;display:flex;justify-content:space-between;gap:16px\">What if the other driver had no insurance?<span style=\"color:var(--acc)\">+<\u002Fspan><\u002Fsummary><p style=\"margin:0 0 20px;font-size:15px;line-height:1.7;color:#3A3F4B;max-width:70ch\">You can usually recover through the uninsured/supplementary coverage on your own policy or a household member’s. If no policy applies, New York’s MVAIC fund may cover you. We identify every available source.<\u002Fp><\u002Fdetails>\n          <details style=\"border-bottom:1px solid #E7E9EE\"><summary style=\"cursor:pointer;list-style:none;padding:20px 0;font-size:17px;font-weight:600;display:flex;justify-content:space-between;gap:16px\">How long will my case take?<span style=\"color:var(--acc)\">+<\u002Fspan><\u002Fsummary><p style=\"margin:0 0 20px;font-size:15px;line-height:1.7;color:#3A3F4B;max-width:70ch\">Straightforward claims often resolve in six to twelve months. Serious-injury cases that require litigation can take longer — we never rush a settlement before you’ve reached maximum medical improvement.<\u002Fp><\u002Fdetails>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <aside style=\"flex:0 1 340px;position:sticky;top:120px;display:flex;flex-direction:column;gap:20px;min-width:0;max-height:calc(100vh - 140px);overflow-y:auto\">\n        <nav aria-label=\"On this page\" style=\"display:flex;flex-direction:column;border:1px solid #E7E9EE;background:#fff\">\n          <span style=\"padding:16px 22px;font-size:11px;font-weight:600;letter-spacing:0.22em;text-transform:uppercase;color:#6B7280;border-bottom:1px solid #E7E9EE\">On this page<\u002Fspan>\n          <sc-for list=\"{{ toc }}\" as=\"t\" hint-placeholder-count=\"6\">\n            <a href=\"{{ t.href }}\" style=\"display:flex;align-items:center;gap:14px;padding:13px 22px;font-size:14px;letter-spacing:0.02em;color:{{ t.color }};font-weight:{{ t.weight }};box-shadow:inset 3px 0 0 {{ t.bar }};transition:color 0.15s,box-shadow 0.15s\" style-hover=\"color:#1B3FA0;background:#F6F7F9\">{{ t.label }}<\u002Fa>\n          <\u002Fsc-for>\n        <\u002Fnav>\n        <div style=\"background:#0B1640;color:#fff;padding:24px 26px;display:flex;flex-direction:column;gap:14px\">\n          <span style=\"font-size:11px;font-weight:600;letter-spacing:0.22em;text-transform:uppercase;color:#9DB2F2\">Free case review<\u002Fspan>\n          <strong
